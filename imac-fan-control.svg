  <rect x="8" y="8" width="112" height="16" fill="#000080"/>
  <rect x="8" y="8" width="112" height="1" fill="#4040C0"/>
  <text x="14" y="20" font-family="Helvetica, Arial, sans-serif"
        font-size="11" font-weight="bold" fill="#FFFFFF">iMac Fan Control</text>

  <rect x="12" y="30" width="104" height="88" rx="4" ry="4"
        fill="url(#screen)" stroke="#0F380F" stroke-width="2"/>
  <rect x="13" y="31" width="102" height="2" fill="#D2F080" opacity="0.6"/>

  <g transform="translate(64 74)">
