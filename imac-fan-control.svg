    <circle r="32" fill="none" stroke="#0F380F" stroke-width="1.5" stroke-dasharray="2 2"/>
    <g fill="#0F380F">
      <path d="M0,-26 C14,-22 18,-12 8,-4 C4,-12 -4,-14 -12,-10 Z"/>
      <path d="M0,-26 C14,-22 18,-12 8,-4 C4,-12 -4,-14 -12,-10 Z" transform="rotate(90)"/>
      <path d="M0,-26 C14,-22 18,-12 8,-4 C4,-12 -4,-14 -12,-10 Z" transform="rotate(180)"/>
      <path d="M0,-26 C14,-22 18,-12 8,-4 C4,-12 -4,-14 -12,-10 Z" transform="rotate(270)"/>
    </g>
    <circle r="5" fill="#0F380F"/>
    <circle r="2" fill="#B8E05F"/>
  </g>

  <g font-family="Courier, monospace" font-size="8" fill="#0F380F" font-weight="bold">
